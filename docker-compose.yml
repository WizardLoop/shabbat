services:
  shabbat:
    build:
      context: .
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-}
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATA_DIR: /app/data
      SESSION_PATH: /app/runtime/bot.shabbat
    volumes:
      - bot-data:/app/data
      - madeline-session:/app/runtime
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "php", "bin/health.php"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
volumes:
  bot-data:
  madeline-session: