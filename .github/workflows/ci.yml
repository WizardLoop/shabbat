name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  php:
    name: php (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        include:
          - php: "8.3"
            version: "8.3.36"
          - php: "8.4"
            version: "8.4.27"
          - php: "8.5"
            version: "8.5.12"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        env:
          update: true
        with:
          php-version: ${{ matrix.version }}
          extensions: pdo_sqlite, mbstring, xml, dom, fileinfo, zlib, zip
          tools: composer:2.10.3
          coverage: none
      - name: Verify exact security-patched PHP runtime
        env:
          EXPECTED_PHP_VERSION: ${{ matrix.version }}
        run: php -r 'if (PHP_VERSION !== getenv("EXPECTED_PHP_VERSION")) { fwrite(STDERR, "Unexpected PHP runtime " . PHP_VERSION . "\n"); exit(1); } echo "Verified PHP " . PHP_VERSION . "\n";'
      - run: composer validate --strict --no-check-all
      - run: composer install --no-interaction --prefer-dist
      - run: composer check-platform-reqs
      - run: composer show --locked --format=json
      - run: composer licenses --format=json
      - run: composer audit --locked --format=json
      - run: composer lint
      - run: composer style
      - run: composer test
      - run: composer analyse
      - run: composer check-locales
      - run: composer check-docs
      - run: composer dependencies -- --output="$RUNNER_TEMP/dependencies.json"
      - run: composer self-check
      - name: Verify release packaging regressions
        if: matrix.php == '8.4'
        run: python3 tests/release_packaging_test.py
      - name: Build exact-commit release archives
        if: matrix.php == '8.4'
        run: composer package
      - name: Verify deployment ZIP without Git or BUILD_COMMIT override
        if: matrix.php == '8.4'
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          archive_dir="$RUNNER_TEMP/shabbat-archive"
          mkdir "$archive_dir"
          unzip -q "dist/shabbat-$(cat VERSION).zip" -d "$archive_dir"
          docker build -t shabbat-archive-ci "$archive_dir"
          docker run --rm shabbat-archive-ci php bin/runtime-permissions.php --require-non-root
          docker run --rm shabbat-archive-ci php bin/self-check.php --release
          docker run --rm -e EXPECTED_COMMIT shabbat-archive-ci php -r '$m=json_decode(file_get_contents("/app/build-info.json"),true,flags:JSON_THROW_ON_ERROR); if ($m["commit"]!==getenv("EXPECTED_COMMIT") || $m["local_changes"]!==false) { exit(1); } echo "Archive identity retained.\n";'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.php == '8.4'
        with:
          name: release-archives-${{ github.sha }}
          path: dist/
          if-no-files-found: error
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: docker build --build-arg BUILD_COMMIT="${{ github.sha }}" -t shabbat-ci .
      - run: docker run --rm shabbat-ci php bin/runtime-permissions.php --require-non-root
      - run: docker run --rm shabbat-ci php bin/self-check.php --release