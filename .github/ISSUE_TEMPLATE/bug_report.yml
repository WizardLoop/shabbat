name: "🐞 Bug report"
description: "Report a reproducible bug"
labels: [bug]
body:
  - type: textarea
    attributes:
      label: "Describe the bug"
      description: "A clear and concise description of what the bug is."
      placeholder: "Bug description"
  - type: textarea
    attributes:
      label: "Steps to Reproduce"
      description: "What steps did you take that led to the bug?"
      placeholder: "1. Go to ...\n2. Click ...\n3. See error"
  - type: textarea
    attributes:
      label: "Expected behavior"
      description: "What did you expect to happen?"
      placeholder: "Expected behavior"
  - type: textarea
    attributes:
      label: "Screenshots/Logs"
      description: "Use synthetic examples and redact tokens, sessions, private group/user IDs, payment data and live databases."
  - type: input
    attributes:
      label: "Bot Version / Commit"
      description: "What version or commit are you using?"
  - type: dropdown
    attributes:
      label: "Environment"
      options:
        - Self-hosted Linux
        - Windows
        - Other

  - type: textarea
    attributes:
      label: "Runtime and verification"
      description: "PHP version, SQLite loaded by PHP, patch verification, failing offline test and whether this is isolated staging. Do not attach secrets."
